apiVersion: networking.istio.io/v1alpha3
kind: Gateway
metadata:
  name: retail-gateway
  namespace: istio-system
spec:
  selector:
    istio: ingress
  servers:
  - port:
      number: 80
      name: http
      protocol: HTTP
    hosts:
    - "*"
---
apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: retail-virtualservice
  namespace: default
spec:
  hosts:
  - "*"
  gateways:
  - istio-system/retail-gateway
  http:
  - match:
    - uri:
        prefix: /
    route:
    - destination:
        host: retail-store-sample-app-ui.default.svc.cluster.local
        port:
          number: 80
