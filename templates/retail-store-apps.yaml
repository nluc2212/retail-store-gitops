apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui
  namespace: default
  labels:
    app.kubernetes.io/name: ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ui
    spec:
      containers:
      - name: ui
        image: public.ecr.aws/aws-containers/retail-store-sample-ui:0.7.0
        ports:
        - containerPort: 8080
        env:
        - name: ENDPOINTS_CATALOG
          value: "http://catalog:80"
        - name: ENDPOINTS_CARTS
          value: "http://carts:80"
        - name: ENDPOINTS_ORDERS
          value: "http://orders:80"
        - name: ENDPOINTS_CHECKOUT
          value: "http://checkout:80"
        resources:
          limits:
            memory: "256Mi"
            cpu: "250m"
          requests:
            memory: "128Mi"
            cpu: "100m"
---
apiVersion: v1
kind: Service
metadata:
  name: ui
  namespace: default
  labels:
    app.kubernetes.io/name: ui
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 8080
    name: http
  selector:
    app.kubernetes.io/name: ui
---
