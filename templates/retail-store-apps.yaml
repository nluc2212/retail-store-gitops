apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui
  namespace: default
  labels:
    app.kubernetes.io/name: ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ui
    spec:
      containers:
      - name: ui
        image: public.ecr.aws/aws-containers/retail-store-sample-ui:0.7.0
        ports:
        - containerPort: 8080
        env:
        - name: ENDPOINTS_CATALOG
          value: "http://catalog:80"
        - name: ENDPOINTS_CARTS
          value: "http://carts:80"
        - name: ENDPOINTS_ORDERS
          value: "http://orders:80"
        - name: ENDPOINTS_CHECKOUT
          value: "http://checkout:80"
        resources:
          limits:
            memory: "256Mi"
            cpu: "250m"
          requests:
            memory: "128Mi"
            cpu: "100m"
---
apiVersion: v1
kind: Service
metadata:
  name: ui
  namespace: default
  labels:
    app.kubernetes.io/name: ui
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 8080
    name: http
  selector:
    app.kubernetes.io/name: ui
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-db
  namespace: default
  labels:
    app.kubernetes.io/name: catalog-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: catalog-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: catalog-db
    spec:
      containers:
      - name: mysql
        image: public.ecr.aws/docker/library/mysql:5.7
        ports:
        - containerPort: 3306
        env:
        - name: MYSQL_ROOT_PASSWORD
          value: "defaultpassword"
        - name: MYSQL_DATABASE
          value: "socksdb"
        resources:
          limits:
            memory: "512Mi"
            cpu: "500m"
          requests:
            memory: "256Mi"
            cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: catalog-db
  namespace: default
  labels:
    app.kubernetes.io/name: catalog-db
spec:
  type: ClusterIP
  ports:
  - port: 3306
    targetPort: 3306
    name: mysql
  selector:
    app.kubernetes.io/name: catalog-db
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog
  namespace: default
  labels:
    app.kubernetes.io/name: catalog
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: catalog
  template:
    metadata:
      labels:
        app.kubernetes.io/name: catalog
    spec:
      containers:
      - name: catalog
        image: public.ecr.aws/aws-containers/retail-store-sample-catalog:0.7.0
        ports:
        - containerPort: 8080
        env:
        - name: DB_ENDPOINT
          value: "catalog-db:3306"
        - name: DB_NAME
          value: "socksdb"
        - name: DB_USER
          value: "root"
        - name: DB_PASSWORD
          value: "defaultpassword"
        resources:
          limits:
            memory: "256Mi"
            cpu: "250m"
          requests:
            memory: "128Mi"
            cpu: "100m"
---
apiVersion: v1
kind: Service
metadata:
  name: catalog
  namespace: default
  labels:
    app.kubernetes.io/name: catalog
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 8080
    name: http
  selector:
    app.kubernetes.io/name: catalog
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: carts-db
  namespace: default
  labels:
    app.kubernetes.io/name: carts-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: carts-db
template:
metadata:
  labels:
    app.kubernetes.io/name: carts-db
spec:
  containers:
  - name: dynamodb
    image: amazon/dynamodb-local:latest
    args: ["-jar", "DynamoDBLocal.jar", "-inMemory", "-sharedDb"]
    ports:
    - containerPort: 8000
    resources:
      limits:
        memory: "256Mi"
        cpu: "250m"
      requests:
        memory: "128Mi"
        cpu: "100m"
---
apiVersion: v1
kind: Service
metadata:
  name: carts-db
  namespace: default
  labels:
    app.kubernetes.io/name: carts-db
spec:
  type: ClusterIP
  ports:
  - port: 8000
    targetPort: 8000
    name: dynamodb
  selector:
    app.kubernetes.io/name: carts-db
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: carts
  namespace: default
  labels:
    app.kubernetes.io/name: carts
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: carts
  template:
    metadata:
      labels:
        app.kubernetes.io/name: carts
    spec:
      containers:
      - name: carts
        image: public.ecr.aws/aws-containers/retail-store-sample-cart:0.7.0
        ports:
        - containerPort: 8080
        env:
        - name: CARTS_DYNAMODB_ENDPOINT
          value: "http://carts-db:8000"
        - name: CARTS_DYNAMODB_TABLENAME
          value: "Items"
        - name: AWS_DEFAULT_REGION
          value: "ap-southeast-1"
        resources:
          limits:
            memory: "256Mi"
            cpu: "250m"
          requests:
            memory: "128Mi"
            cpu: "100m"
---
apiVersion: v1
